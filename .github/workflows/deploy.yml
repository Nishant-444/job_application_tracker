name: Deploy to AWS

on:
  push:
    branches: [master]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          push: true
          # This now uses your actual Docker username from your secrets
          tags: ${{ secrets.DOCKER_USERNAME }}/job-tracker:latest
          build-args: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            NEXT_PUBLIC_BETTER_AUTH_URL=https://jobs.nishants.dev
            BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH into EC2 and Deploy
        uses: appleboy/ssh-action@master
        with:
          host: 13.233.107.185
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/job-tracker:latest
            sudo docker stop job-tracker || true
            sudo docker rm job-tracker || true

            sudo docker run -d \
              --name job-tracker \
              --restart always \
              -p 3000:3000 \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              -e BETTER_AUTH_SECRET="${{ secrets.BETTER_AUTH_SECRET }}" \
              -e BETTER_AUTH_URL="https://jobs.nishants.dev" \
              -e NEXT_PUBLIC_BETTER_AUTH_URL="https://jobs.nishants.dev" \
              -e GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
              -e GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
              ${{ secrets.DOCKER_USERNAME }}/job-tracker:latest

            sudo docker image prune -f
